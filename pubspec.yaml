name: techlaunchpad
description: TechLaunchpad - Your tech career companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10
  provider: ^6.1.1
  go_router: ^13.0.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  share_plus: ^7.2.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  timeago: ^3.6.1
  carousel_slider: ^4.2.1
  animate_do: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
